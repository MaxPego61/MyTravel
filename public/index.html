<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyTravel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">

  <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <!-- Login screen, shown until MSAL confirms the account -->
  <div id="login-screen">
    <h1>MyTravel</h1>
    <button id="loginBtn" onclick="signIn()">Sign in with Microsoft</button>
  </div>

  <!-- The actual app, hidden until the user is authenticated -->
  <div class="container" id="app-container" style="display:none;">
    <div id="sidebar-left">
      <h1>MyTravel</h1>
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search trip or city...">
        <select id="yearFilter"><option value="">All years</option></select>
        <select id="companionFilter"><option value="">All companions</option></select>
        <div class="toggle-buttons">
          <button id="toggleLines" class="active">Routes ON</button>
          <button id="toggleMarkers" class="active">Markers ON</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">Trips <span id="totalTrips">0</span></div>
        <div class="stat">Flights <span id="totalFlights">0</span></div>
        <div class="stat">Km <span id="totalKm">0</span></div>
        <div class="stat">Countries <span id="totalCountries">0</span></div>
      </div>

      <div id="tripList"></div>
    </div>

    <div id="map">
      <div id="map-loading" class="map-loading">Loading map...</div>
    </div>

    <div class="mobile-controls" id="mobileControls">
      <div class="mobile-btn" id="open-left"></div>
      <div class="mobile-btn" id="open-right"></div>
    </div>

    <div id="sidebar-right">
      <div id="details-content">
        <p><em>Click on a trip or a city</em></p>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>

  <script>
    // Called by our own init below after a successful login
    function startMyTravel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-container").style.display = "grid";

      // Fill the mobile buttons with the SVG icons
      document.getElementById("open-left").innerHTML = icon("list");
      document.getElementById("open-right").innerHTML = icon("info");

      loadGoogleKey().then(() => {
        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${window.GOOGLE_MAPS_API_KEY}&callback=initMap&libraries=marker&loading=async`;
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      });
    }

    // Init specifico di questa pagina (index.html). photos.html ha la sua
    // versione dedicata in photos.js, non condividono più questo blocco.
    document.addEventListener("DOMContentLoaded", async () => {
      await loadConfig();

      msalInstance = new msal.PublicClientApplication(getMsalConfig());

      msalInstance.handleRedirectPromise().then(() => {
        const ok = checkLogin();
        if (ok) {
          addLogoutButton(); // scommenta solo per testare il logout MSAL
          startMyTravel();
        }
      }).catch(err => {
        console.error("MSAL ERROR:", err);
      });
    });
  </script>

</body>
</html>
